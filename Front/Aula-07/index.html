<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1> TRABALHANDO COM IMPUTS</h1>
    </header>
    <!-- Imput -->
    <main>
        <h2>Formulario de cadastro</h2>

        <!--  Imput - coleta informacoes do usuario-->
        <!-- Form - Englobar os campos do formulario -->
        <!-- Action - Pra onde vão as informalçoes preenchidas  -->
        <!-- Method - forma como vão as informações -->
         <form action="" method="">

            <!-- lebal - texto de apoio pra guiar o imput -->
            <label for="">Nome Completo: </label>
            <!-- text - caracteres em geral -->
            <!-- name - usado para indetificar o input quando enviar os dados -->
            <!-- id - identificação daquele elemente html -->
            <input type="text" name="Nome Completo" id="">

            <br>
            <br>
            <!-- forma 2 - input dentro label -->
            <label for="">
                Senha
                <!-- password - senhas  -->
                <input type="password">
            </label>

         </form>
    </main>
    <footer>
        <P> DIREITOS SÃO HUMANOS?</P>
    </footer>
</body>
</html>
